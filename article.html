<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读文章 - NenoDrop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 专为阅读优化的排版 */
    .article-wrapper { max-width: 740px; margin: 60px auto; padding: 0 20px; animation: fadeIn 0.6s ease; }
    .back-link { display: inline-block; color: var(--text-soft); text-decoration: none; margin-bottom: 40px; font-weight: 500; transition: color 0.2s; }
    .back-link:hover { color: var(--water-blue-deep); }
    .article-title { font-size: 2.6rem; font-weight: 700; line-height: 1.25; margin-bottom: 16px; letter-spacing: -0.02em; color: var(--text-dark); }
    .article-meta { color: #88999e; font-size: 0.9rem; margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid rgba(0,0,0,0.06); }
    /* 正文段落优化：极大的行高和字距，阅读极其舒适 */
    .article-content { font-size: 1.15rem; line-height: 2; color: #2b3d42; white-space: pre-wrap; letter-spacing: 0.01em; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .article-title { font-size: 1.8rem; } .article-content { font-size: 1.05rem; } }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar" style="padding: 20px 0;">
      <a href="index.html" class="logo">Neno<span>Drop</span></a>
      <a href="index.html" style="text-decoration:none; color:var(--text-soft);">返回首页</a>
    </nav>

    <div class="article-wrapper">
      <a href="index.html#blog" class="back-link">← 返回博客列表</a>
      <h1 class="article-title" id="articleTitle">加载中...</h1>
      <div class="article-meta">NenoDrop 灵感博客</div>
      <div class="article-content" id="articleBody">正在获取文章...</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');
    if (slug) {
      fetch(`https://api.github.com/repos/sophia88cm/nenodrop/contents/posts/${slug}.md`)
        .then(res => res.text())
        .then(text => {
          const parts = text.split('---');
          let title = "无标题", body = "";
          if (parts.length >= 3) {
            body = parts.slice(2).join('---').trim();
            parts[1].split('\n').forEach(line => {
              if(line.startsWith('title:')) title = line.replace('title:', '').trim().replace(/['"]/g, '');
            });
          } else { body = text; }
          document.getElementById('articleTitle').textContent = title;
          document.getElementById('articleBody').textContent = body;
          document.title = `${title} - NenoDrop`;
        })
        .catch(() => {
          document.getElementById('articleTitle').textContent = "加载失败";
          document.getElementById('articleBody').textContent = "文章走丢了，请返回首页重试。";
        });
    }
  </script>
</body>
</html>
