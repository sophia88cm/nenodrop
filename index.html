<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NenoDrop · 灵感、故事与音轨降落之地</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- 导航栏 -->
    <nav class="navbar">
      <a href="index.html" class="logo" id="logo"></a>
      <ul class="nav-links" id="navLinks"></ul>
    </nav>

    <!-- 首屏 Hero -->
    <section class="hero" id="home">
      <div class="hero-content">
        <h1 id="heroTitle"></h1>
        <p id="heroSubtitle"></p>
        <div class="hero-actions" id="heroButtons"></div>
      </div>
    </section>

    <!-- 注意：原来的“关于”板块已经从首页删除，移到了独立的 about.html -->

    <!-- 故事书 + 植萃（双列展示） -->
    <div class="brand-grid">
      <!-- 故事书 -->
      <div class="brand-card" id="storybook">
        <h3 id="storybookTitle"></h3>
        <div class="brand-sub" id="storybookSubtitle"></div>
        <p id="storybookDesc"></p>
        <div class="card-footer">
          <div style="margin-bottom:16px;font-weight:500;" id="storybookChannelTitle"></div>
          <p style="font-size:0.95rem;margin-bottom:20px;" id="storybookChannelDesc"></p>
          <a id="storybookBtn" target="_blank" rel="noopener" class="btn" style="background:#fff;border:1.5px solid var(--water-blue-deep);"></a>
        </div>
      </div>

      <!-- 植萃 Flora Flow -->
      <div class="brand-card" id="flora">
        <h3 id="floraTitle"></h3>
        <div class="brand-sub" id="floraSubtitle"></div>
        <p id="floraDesc"></p>
        <div class="product-tags" id="floraTags"></div>
        <div class="card-footer">
          <a id="floraBtn" target="_blank" rel="noopener" class="btn" style="background:#fff;border:1.5px solid var(--plant-green-deep);"></a>
        </div>
      </div>
    </div>

    <!-- Lofi 音乐 -->
    <section id="music">
      <div class="card music-card">
        <h3 id="musicTitle" style="font-size:1.9rem;font-weight:500;margin-bottom:8px;"></h3>
        <div class="brand-sub" id="musicSubtitle" style="margin-bottom:18px;"></div>
        <div style="margin-bottom:12px;font-weight:500;" id="musicChannelTitle"></div>
        <p style="color:var(--text-soft);margin-bottom:24px;" id="musicChannelDesc"></p>
        <a id="musicBtn" target="_blank" rel="noopener" class="btn btn-primary"></a>
      </div>
    </section>

    <!-- AI 实验室 -->
    <section id="ai-lab">
      <h2 id="aiTitle"></h2>
      <div class="section-subhead" id="aiSubtitle"></div>
      <div class="card" style="padding:32px;">
        <ul class="ai-list" id="aiList"></ul>
      </div>
    </section>

    <!-- 博客（会自动从后台拉取文章） -->
    <section id="blog">
      <h2 id="blogTitle"></h2>
      <div class="section-subhead" id="blogSubtitle"></div>
      <div class="blog-list" id="blogList"></div>
    </section>

    <!-- 常见问题 FAQ -->
    <section id="faq">
      <h2 id="faqTitle"></h2>
      <div class="faq-list" id="faqList"></div>
    </section>

    <!-- 页脚 -->
    <footer id="contact">
      <div class="footer-motto" id="footerMotto"></div>
      <div class="footer-links" id="footerLinks"></div>
      <div class="copyright" id="footerCopyright"></div>
    </footer>
  </div>

  <!-- 引入配置文件、渲染脚本和后台跳转 -->
  <script src="content.js"></script>
  <script src="render.js"></script>
</body>
</html>
